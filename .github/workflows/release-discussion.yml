name: Announce Release in Discussion

# 每当 GitHub Release 发布后，自动在仓库 Discussion 里发布一条版本公告帖。
# 依赖一个具有 Disc、write:discussion 权限的 Personal Access Token（存入仓库 secret：DISCUSSIONS_PAT）。

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  announce:
    name: Post Release Announcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          # 必须使用带 write:discussion 权限的 PAT，默认 GITHUB_TOKEN 无权限创建 Discussion 分类下的帖子
          github-token: ${{ secrets.DISCUSSIONS_PAT }}
          script: |
                const { owner, repo } = context.repo;
                const rel = context.payload.release;

                // 读取 Release 自动生成的正文作为公告主体
                const release = await github.rest.repos.getRelease({
                  owner, repo, release_id: rel.id
                });
                const notes = release.data.body || 'See the release page for the full changelog.';
                const body = [
                  `## ${rel.tag_name}`,
                  '',
                  notes,
                  '',
                  `:arrow_down: **[Download the release](${rel.html_url})**`,
                  '',
                  `_Auto-posted by dqex CI. Tagged by @${release.data.author.login}._`
                ].join('\n');

                // 仓库 node_id
                const repoRes = await github.request('GET /repos/{owner}/{repo}', { owner, repo });
                const repoId = repoRes.data.node_id;

                // 自动探测「Announcements / 公告 / General」分类，找不到则退回第一个可用分类
                const catQuery = await github.graphql(`
                  query($repoId: ID!) {
                    node(id: $repoId) {
                      ... on Repository {
                        discussionCategories(first: 50) {
                          edges { node { id name } }
                        }
                      }
                    }
                  }
                `, { repoId });
                const cats = catQuery.node.discussionCategories.edges.map(e => e.node);
                const target = cats.find(c => /announce/i.test(c.name))
                  || cats.find(c => /公告/i.test(c.name))
                  || cats[0];
                if (!target) throw new Error('No discussion category available.');
                console.log('Using category: ' + target.name + ' (' + target.id + ')');

                // 创建公告帖
                const created = await github.graphql(`
                  mutation($repoId: ID!, $categoryId: ID!, $title: String!, $body: String!) {
                    createDiscussion(input: {
                      repositoryId: $repoId,
                      categoryId: $categoryId,
                      title: $title,
                      body: $body
                    }) {
                      url
                    }
                  }
                `, { repoId, categoryId: target.id, title: `Release ${rel.tag_name}`, body });
                console.log('Announcement posted: ' + created.createDiscussion.url);