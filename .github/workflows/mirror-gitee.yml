name: Mirror to Gitee

# 每次 push 到 main 时，自动把代码与全部 tags 镜像同步到 Gitee。
# 说明：仅监听 main 触发。若同时监听 v* tag，tag 触发时 checkout 为 detached HEAD、
#       本地不存在 main 分支，导致 push main 报 "does not match any"。
#       项目发布总是先推 main 再打 tag，因此 main 触发即能一并同步 main 与全部 tags。
# 需在仓库设置为 secret：GITEE_TOKEN（Gitee 私人令牌，projects 权限）。
# 若 secret 未配置，该 job 会安全跳过（不会失败）。

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mirror-gitee
  cancel-in-progress: true

jobs:
  mirror:
    name: Push to Gitee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror main + tags to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "GITEE_TOKEN secret 未配置，跳过 Gitee 镜像"
            exit 0
          fi

          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/fjcn/dqex.git"
          git push gitee "refs/heads/main:refs/heads/main"

          echo ">> push tags (若存在)"
          for t in $(git tag); do
            git push gitee "refs/tags/${t}:refs/tags/${t}"
          done

          echo ">> Gitee 镜像同步完成"

      # Gitee Releases 附件同步：只同步最新一个 tag，避免每次 push 都全量重传。
      # 国内用户的主要入口是 Gitee，没有附件等于镜像只给了代码、拿不到安装包。
      - name: Sync latest release assets to Gitee
        if: ${{ env.GITEE_TOKEN != '' }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          tag=$(git tag --sort=-v:refname | head -1)
          if [ -z "$tag" ]; then
            echo "无 tag，跳过"
            exit 0
          fi
          echo ">> 同步 $tag 的发行版附件到 Gitee"

          mkdir -p /tmp/gitee-assets && cd /tmp/gitee-assets
          failed=0
          for name in $(curl -fsSL "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
                        | grep -o '"browser_download_url": *"[^"]*"' \
                        | cut -d'"' -f4); do
            file=$(basename "$name")
            echo ">> 下载 $file"
            curl -fsSL -o "$file" "$name" || { echo "!! 下载失败: $file"; failed=1; continue; }
            curl -fsSL -X POST "https://gitee.com/api/v5/repos/fjcn/dqex/releases/${tag}/attach_files" \
              -H "Authorization: token ${GITEE_TOKEN}" \
              -F "attachment=@${file}" || { echo "!! 上传失败: $file"; failed=1; }
          done

          [ "$failed" -eq 0 ] && echo ">> Gitee 发行版附件同步完成" || echo "!! 部分附件同步失败，请检查日志"