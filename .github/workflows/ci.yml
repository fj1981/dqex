name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.1'
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Build examples (library API compile check)
        run: go build ./examples/...

      - name: Go test
        run: go test ./...

  release:
    name: Cross-platform Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.1'
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Build frontend
        run: cd web && npm run build

      - name: Cross-platform package (make release)
        # TAGS=opensource：GitHub Release 产物在"关于"弹窗展示项目 Git 地址与联系方式；本地出包不传该变量即不带
        run: make release TAGS=opensource

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/dqex-*.zip
          generate_release_notes: true

      # 由 GITHUB_TOKEN 创建的 Release 不会触发 release:published 事件，
      # 因此公告改为在发布后同一 job 内直接发送。
      - name: Post Release announcement to Discussions
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DISCUSSIONS_PAT }}
          script: |
            const { owner, repo } = context.repo;
            const tag = context.ref.replace('refs/tags/', '');

            const r = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const body = [
              `## ${tag}`, '',
              r.data.body || '',
              '',
              `:arrow_down: **[Download the release](${r.data.html_url})**`
            ].join('\n');

            const repoRes = await github.request('GET /repos/{owner}/{repo}', { owner, repo });
            const repoId = repoRes.data.node_id;
            const catQuery = await github.graphql(`
              query($repoId: ID!) {
                node(id: $repoId) { ... on Repository { discussionCategories(first: 50) { edges { node { id name } } } } }
              }
            `, { repoId });
            const cats = catQuery.node.discussionCategories.edges.map(e => e.node);
            const target = cats.find(c => /announce/i.test(c.name))
              || cats.find(c => /公告/i.test(c.name))
              || cats[0];
            if (!target) throw new Error('No discussion category available.');

            const created = await github.graphql(`
              mutation($repoId: ID!, $cat: ID!, $title: String!, $body: String!) {
                createDiscussion(input: { repositoryId: $repoId, categoryId: $cat, title: $title, body: $body }) { url }
              }
            `, { repoId, cat: target.id, title: `Release ${tag}`, body });
            console.log('Announcement posted: ' + created.createDiscussion.url);
