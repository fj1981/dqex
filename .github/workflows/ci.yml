name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.1'
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Build examples (library API compile check)
        run: go build ./examples/...

      - name: Go test
        run: go test ./...

  release:
    name: Cross-platform Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.1'
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Build frontend
        run: cd web && npm run build

      - name: Cross-platform package (make release)
        # TAGS=opensource：GitHub Release 产物在"关于"弹窗展示项目 Git 地址与联系方式；本地出包不传该变量即不带
        run: make release TAGS=opensource

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/dqex-*.zip
          generate_release_notes: true
